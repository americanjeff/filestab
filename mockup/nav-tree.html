<!doctype html>
<!--
  filestab nav-pane tree mockup — the dsh 0.1.5-rc.2 right-panel files tree look,
  with filestab's VCS marks. Single file, no dependencies. Open directly
  (file:// works).

  The tree is the 0.1.5-rc.2 treatment (18px indents, 10px-radius rows,
  open/closed folder glyphs, colored file-type glyphs, per-directory note
  rows). The contested bits are levers in the MOCK bar below:
    LETTER:     gutter (VS Code) | before name (GitHub) | right slot (current filestab)
    FOLDERS:    count pill (GitHub) | letter (VS Code, when unambiguous) | plain (dsh)
    NAME CUE:   typographic (M bold, A/U italic, D faded — VS Code) | plain
    CHEVRON:    none (dsh) | keep (current filestab)
  Data is all in the DATA block at the bottom — edits re-render. Directories
  expand/collapse for real; clicking a file shows the selection highlight.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>filestab — nav pane tree mockup</title>
<style>
  :root {
    --bg-frame: #141519;
    --bg-panel: #1b1c21;
    --bg-raised: #222329;
    --bg-hover: #282930;
    --bg-active: #2f3138;
    --line: #2c2d34;
    --line-strong: #3a3c45;
    --ink: #d7d9e0;
    --ink-dim: #9a9daa;
    --ink-faint: #6b6e7b;
    --accent: #7aa2f7;
    --st-m: #e0a458;
    --st-a: #71c376;
    --st-u: #71c376;
    --st-d: #e06c75;
    --st-r: #6cb6e0;
    --st-c: #e06c75;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg-frame); color: var(--ink); font: 13px/1.45 var(--sans); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  #frame { display: flex; height: 100%; }

  /* ============ the Files pane (what we are designing) ============ */
  #pane {
    width: 360px; flex: none; display: flex; flex-direction: column;
    background: var(--bg-panel); border-right: 1px solid var(--line);
    min-height: 0;
  }
  /* header: the dsh root-path row — directories dimmed, the last segment
     full ink; the path fades at the left when clipped; pencil = path-edit,
     reload at the right. */
  .hdr {
    flex: none; height: 38px; display: flex; align-items: center; gap: 4px;
    padding: 0 6px 0 16px; border-bottom: .5px solid var(--line);
  }
  .hdr-path { flex: 1; min-width: 0; display: flex; justify-content: flex-end; overflow: hidden; font-size: 12px; white-space: nowrap; }
  .hdr-path.clipped { mask-image: linear-gradient(90deg, #0000, #000 28px); -webkit-mask-image: linear-gradient(90deg, #0000, #000 28px); }
  .hdr-dir { color: var(--ink-faint); }
  .hdr-name { color: var(--ink); }
  .hdr-tool {
    flex: none; width: 28px; height: 28px; display: inline-flex; align-items: center;
    justify-content: center; border-radius: 6px; color: var(--ink-dim);
  }
  .hdr-tool:hover { color: var(--ink); background: var(--bg-hover); }
  .hdr-input {
    flex: 1; min-width: 0; height: 20px; font: 12px var(--mono);
    color: var(--ink); background: none; border: none; outline: none;
  }

  /* commit strip (filestab's status line, kept) */
  .strip { flex: none; display: flex; align-items: center; gap: 8px; padding: 4px 16px; }
  .strip select {
    flex: 1; min-width: 0; font: 11px var(--mono); color: var(--ink);
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px;
  }
  .strip-count { flex: none; font-size: 11px; color: var(--ink-faint); white-space: nowrap; }

  /* ============ the tree (dsh 0.1.5-rc.2 metrics) ============ */
  .tree { flex: 1; min-height: 0; overflow: auto; padding: 8px 0 8px 8px; }
  ul.level { margin: 0; padding: 0; list-style: none; }
  ul.level ul.level { padding-left: 18px; }
  li.item { margin: 0; padding: 0; }

  .row {
    width: 100%; min-width: 0; display: flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 10px; text-align: left; cursor: pointer;
    color: inherit; background: none; border: 0;
  }
  .row:hover { background: var(--bg-hover); }
  .row.sel { background: var(--bg-active); }
  .row.sel:hover { background: var(--bg-active); }

  /* gutter slot: fixed 14px on EVERY row so names stay aligned; carries the
     status letter when the LETTER lever is "gutter" (VS Code placement). */
  .gutter { flex: none; width: 14px; display: flex; justify-content: center; }
  .gutter .ltr { font: 700 10.5px/1 var(--mono); }
  /* letter rendered BEFORE the name (GitHub placement) */
  .preltr { flex: none; font: 700 10.5px/1 var(--mono); }
  .icon { flex: none; display: inline-flex; }
  .icon svg { display: block; }
  .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* name cues (VS Code typography): the weight/italic does the talking */
  body.cue-on .name.cue-m { font-weight: 600; }
  body.cue-on .name.cue-au { font-style: italic; }
  body.cue-on .name.cue-d { opacity: .55; text-decoration: line-through; }
  /* right slot: the fixed 14px letter slot (current filestab) or the
     folder rollup pill, depending on levers. */
  .right { flex: none; width: 14px; display: flex; justify-content: center; }
  .right .ltr { font: 700 10.5px/1 var(--mono); }
  .chev { flex: none; display: inline-flex; }

  /* the GitHub-style rollup pill */
  .pill {
    flex: none; min-width: 16px; padding: 0 5px; border-radius: 999px;
    font-size: 10.5px; font-weight: 600; line-height: 14px; text-align: center;
    color: var(--ink-dim); background: var(--bg-raised);
  }
  .pill.conf { color: var(--st-c); background: rgba(224,108,117,.14); }

  /* per-directory note rows (dsh treatment): loading / empty / error */
  li.note { padding: 3px 10px; font-size: 12px; color: var(--ink-faint); }
  li.note.err { color: var(--st-d); }

  /* ============ footer (kept from the real pane) ============ */
  .ftr {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-top: 1px solid var(--line);
  }
  .ftr-btn { display: inline-flex; align-items: center; gap: 4px; padding: 0 2px; font-size: 13px; font-weight: 500; color: var(--ink-dim); }
  .ftr-btn:hover { color: var(--ink); }
  .ftr-btn.on { color: var(--ink); }
  .ftr-gap { flex: 1; }

  /* ============ decorative preview pane (context only) ============ */
  #preview {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    background: var(--bg-frame);
  }
  #preview .ph {
    flex: none; padding: 10px 16px; border-bottom: 1px solid var(--line);
    color: var(--ink-faint); font-size: 12px;
  }
  #preview .ph b { color: var(--ink-dim); font-weight: 600; }
  #preview .pb { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 12px; }
  #preview pre {
    flex: 1; margin: 0; padding: 12px 16px; overflow: auto;
    font: 11.5px/1.6 var(--mono); color: var(--ink-dim); white-space: pre;
  }

  /* ============ mock controls ============ */
  #mockbar {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 50;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    max-width: 92vw; background: rgba(27,28,33,.95); border: 1px solid var(--line-strong);
    border-radius: 10px; padding: 8px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.4);
  }
  #mockbar .lbl { font-size: 11px; color: var(--ink-faint); white-space: nowrap; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
  .seg button { padding: 3px 9px; font-size: 11.5px; color: var(--ink-dim); border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--bg-active); color: var(--ink); }
  li.hidden-item { display: none; }
  body.show-hidden li.hidden-item { display: list-item; }
</style>
</head>
<body class="cue-on">

<div id="frame">
  <div id="pane">
    <div class="hdr" id="hdr"></div>
    <div class="strip">
      <select id="revSel" title="commit to review">
        <option>@ 265c125 update nav pane mockup</option>
        <option>969e71 add vcs layer</option>
      </select>
      <span class="strip-count" id="stripCount"></span>
    </div>
    <div class="tree" id="tree"></div>
    <div class="ftr">
      <button class="ftr-btn" id="hiddenBtn">Show hidden files</button>
      <span class="ftr-gap"></span>
      <button class="ftr-btn">⟳ Reload</button>
    </div>
  </div>

  <div id="preview">
    <div class="ph" id="pvHead">preview pane — context only</div>
    <div class="pb" id="pvBody">select a file in the tree</div>
  </div>
</div>

<div id="mockbar">
  <span class="lbl">LETTER</span>
  <div class="seg" id="segLetter">
    <button data-v="gutter" class="on">Gutter (VS Code)</button>
    <button data-v="name">Before name (GitHub)</button>
    <button data-v="right">Right slot (current)</button>
  </div>
  <span class="lbl">FOLDERS</span>
  <div class="seg" id="segFolders">
    <button data-v="pill" class="on">Count pill</button>
    <button data-v="letter">Letter</button>
    <button data-v="plain">Plain</button>
  </div>
  <span class="lbl">NAME CUE</span>
  <div class="seg" id="segCue">
    <button data-v="on" class="on">Typographic</button>
    <button data-v="off">Plain</button>
  </div>
  <span class="lbl">CHEVRON</span>
  <div class="seg" id="segChev">
    <button data-v="none" class="on">None (dsh)</button>
    <button data-v="keep">Keep</button>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
 * DATA — edit here to iterate.
 * st: null | "A" | "M" | "D" | "R" | "U" | "C"   (jj/git status letter)
 * hidden: true → only shown with "Show hidden files"
 * note: "loading" | "empty" | {err: "..."} on a dir = a special level
 * ===================================================================== */
const DATA = {
  name: "filestab", path: "~/dev/tools/agent-stuff/filestab", open: true, children: [
    { name: "src", open: true, children: [
      { name: "dsh", open: true, children: [
        { name: "client.d.ts" },
        { name: "client.tsx", st: "M" },
      ]},
      { name: "containment.ts" },
      { name: "filesystem.ts", st: "M" },
      { name: "git.ts" },
      { name: "jj.ts", st: "C" },
      { name: "magic.ts" },
      { name: "snapshot.ts" },
      { name: "index.ts" },
    ]},
    { name: "test", open: true, children: [
      { name: "e2e", open: true, note: "loading", children: [
        { name: "e2e.test.mjs" },
        { name: "harness.mjs" },
      ]},
      { name: "client.test.mjs", st: "M" },
      { name: "containment.test.mjs" },
      { name: "filesystem.test.mjs" },
      { name: "git.test.mjs" },
      { name: "host.test.mjs" },
      { name: "jj.test.mjs" },
      { name: "magic.test.mjs" },
    ]},
    { name: "mockup", open: true, children: [
      { name: "index.html", st: "M" },
      { name: "nav-tree.html", st: "A" },
    ]},
    { name: "scripts", children: [
      { name: "copy-mermaid.mjs", st: "M" },
    ]},
    { name: "dist", children: [
      { name: "client.js", st: "A" },
      { name: "index.d.ts", st: "M" },
      { name: "index.js", st: "M" },
    ]},
    { name: "assets", open: true, note: "empty", children: [] },
    { name: "docs", open: true, note: { err: "the folder no longer exists (docs)" }, children: [] },
    { name: ".jj", hidden: true, children: [
      { name: "repo" },
      { name: "working_copy" },
    ]},
    { name: ".gitignore", hidden: true },
    { name: "package.json", st: "M" },
    { name: "pnpm-lock.yaml" },
    { name: "README.md" },
    { name: "README.zh.md" },
    { name: "CHANGELOG.md" },
    { name: "BUGS.md" },
    { name: "dsh.cordis.yml" },
    { name: "LICENSE" },
    { name: "deploy.sh" },
    { name: "notes.md", st: "U" },
    { name: "tsconfig.client.json" },
    { name: "tsconfig.json" },
    { name: "tsdown.config.ts", st: "R" },
    { name: "old-build.mjs", st: "D" },
  ],
};

/* ---------- levers ---------- */
const LV = { letter: "gutter", folders: "pill", cue: "on", chev: "none" };

/* ---------- status meta ---------- */
const ST_COLOR = { A: "var(--st-a)", M: "var(--st-m)", D: "var(--st-d)", R: "var(--st-r)", U: "var(--st-u)", C: "var(--st-c)" };
const ST_TITLE = { A: "added", M: "modified", D: "deleted", R: "renamed", U: "untracked", C: "conflict" };

/* ---------- icons (16px, dsh-style line glyphs; file type = colored sheet) ---------- */
const FOLDER_CLOSE = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M1.8 3.6h4l1.6 1.8h6.8v7a1.2 1.2 0 0 1-1.2 1.2H3a1.2 1.2 0 0 1-1.2-1.2V3.6z"/></svg>`;
const FOLDER_OPEN  = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M1.8 3.6h4l1.6 1.8h5.8a1.2 1.2 0 0 1 1.2 1.2v.8H4.4a1.6 1.6 0 0 0-1.55 1.2L1.8 13V3.6z"/></svg>`;
const CHEV = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l5 4-5 4"/></svg>`;
const PENCIL = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.5l2.5 2.5L5 11.5l-3 .5.5-3L9 2.5z"/></svg>`;
const RELOAD = `<svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M12.6 7.5a5.1 5.1 0 1 1-1.5-3.6M12.6 1.6v2.7h-2.7"/></svg>`;
const TYPE_COLOR = {
  ts: "#7aa2f7", tsx: "#7aa2f7", js: "#e5c07b", mjs: "#e5c07b", cjs: "#e5c07b",
  md: "#9a9daa", markdown: "#9a9daa",
  json: "#e0a458", yml: "#e0a458", yaml: "#e0a458",
  html: "#e5976b", css: "#6cb6e0",
  sh: "#71c376", lock: "#71c376",
};
function fileIcon(name) {
  const ext = name.includes(".") ? name.split(".").pop().toLowerCase() : "";
  const c = TYPE_COLOR[ext] || "#6b6e7b";
  return `<svg width="16" height="16" viewBox="0 0 16 16" fill="none">
    <path d="M4 1.8h5.4L13 5.4v8.8a.8.8 0 0 1-.8.8H4a.8.8 0 0 1-.8-.8V2.6a.8.8 0 0 1 .8-.8z" stroke="${c}" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M9.4 1.8v3.6H13" stroke="${c}" stroke-width="1.2" stroke-linejoin="round"/>
  </svg>`;
}

/* ---------- order: directories first, then by name (natural) ---------- */
const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
function order(entries) {
  return [...entries].sort((a, b) => {
    const g = Number(!!(b.children)) - Number(!!(a.children));
    return g !== 0 ? g : collator.compare(a.name, b.name);
  });
}

/* ---------- rollup: how many STATUS-CARRYING files under a dir ---------- */
function rollup(node) {
  let count = 0, conflicts = 0;
  for (const ch of node.children || []) {
    if (ch.children) { const r = rollup(ch); count += r.count; conflicts += r.conflicts; }
    else if (ch.st) { count++; if (ch.st === "C") conflicts++; }
  }
  return { count, conflicts };
}
/* VS Code folder-letter rule: only when the subtree's status is unambiguous */
function folderLetter(node) {
  const seen = new Set();
  (function walk(n) { for (const ch of n.children || []) { ch.children ? walk(ch) : ch.st && seen.add(ch.st); } })(node);
  return seen.size === 1 ? [...seen][0] : null;
}

/* ---------- render ---------- */
const treeEl = document.getElementById("tree");
let selected = null;

function letterSpan(st) {
  return `<span class="ltr" style="color:${ST_COLOR[st]}" title="${ST_TITLE[st]}">${st}</span>`;
}

function renderRow(node, depth) {
  const isDir = !!node.children;
  const li = document.createElement("li");
  li.className = "item" + (node.hidden ? " hidden-item" : "");
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "row" + (selected && !isDir && selected.path === node.path ? " sel" : "");

  const parts = [];
  // gutter slot — the letter lives here when the lever says so
  if (LV.letter === "gutter") parts.push(`<span class="gutter">${node.st && !isDir ? letterSpan(node.st) : (isDir && LV.folders === "letter" ? (letterSpan(folderLetter(node)) || "") : "")}</span>`);
  // icon
  parts.push(`<span class="icon" style="color:var(--ink-faint)">${isDir ? (node.open ? FOLDER_OPEN : FOLDER_CLOSE) : fileIcon(node.name)}</span>`);
  // letter before the name (GitHub placement)
  if (LV.letter === "name" && node.st && !isDir) parts.push(`<span class="preltr" style="color:${ST_COLOR[node.st]}" title="${ST_TITLE[node.st]}">${node.st}</span>`);
  // name, with the VS Code typographic cue
  const cue = node.st === "M" ? "cue-m" : (node.st === "A" || node.st === "U") ? "cue-au" : node.st === "D" ? "cue-d" : "";
  parts.push(`<span class="name ${cue}" title="${node.path}${node.st ? " — " + ST_TITLE[node.st] : ""}">${node.name}</span>`);
  // right slot
  if (isDir) {
    if (LV.folders === "pill") {
      const r = rollup(node);
      parts.push(r.count ? `<span class="pill${r.conflicts ? " conf" : ""}" title="${r.count} changed${r.conflicts ? ", " + r.conflicts + " conflict" : ""}">${r.count > 99 ? "99+" : r.count}</span>` : `<span class="right"></span>`);
    } else if (LV.folders === "letter") {
      parts.push(`<span class="right">${LV.letter === "right" ? "" : (folderLetter(node) ? letterSpan(folderLetter(node)) : "")}</span>`);
    } else parts.push(`<span class="right"></span>`);
  } else if (LV.letter === "right") {
    parts.push(`<span class="right">${node.st ? letterSpan(node.st) : ""}</span>`);
  }
  if (isDir && LV.chev === "keep") parts.push(`<span class="chev" style="color:var(--ink-faint)">${CHEV}</span>`);

  btn.innerHTML = parts.join("");
  btn.addEventListener("click", () => {
    if (isDir) { node.open = !node.open; render(); }
    else { selected = node; render(); renderPreview(); }
  });
  li.appendChild(btn);

  if (isDir && node.open) {
    const ul = document.createElement("ul");
    ul.className = "level";
    const note = node.note;
    if (note === "loading") {
      const n = document.createElement("li"); n.className = "note"; n.textContent = "Reading…"; ul.appendChild(n);
    } else if (note === "empty") {
      const n = document.createElement("li"); n.className = "note"; n.textContent = "(empty)"; ul.appendChild(n);
    } else if (note && note.err) {
      const n = document.createElement("li"); n.className = "note err"; n.textContent = note.err; ul.appendChild(n);
    } else {
      for (const ch of order(node.children)) {
        ch.path = node.path + (node.path === "/" ? "" : "/") + ch.name;
        if (ch.children) ch.path = ch.path; // dirs keep their own path
        ul.appendChild(renderRow(ch, depth + 1));
      }
    }
    li.appendChild(ul);
  }
  return li;
}

function render() {
  // header: root path row
  const hdr = document.getElementById("hdr");
  const dir = DATA.path.slice(0, DATA.path.lastIndexOf("/") + 1);
  hdr.innerHTML = `
    <div class="hdr-path" title="${DATA.path}"><span class="hdr-dir">${dir}</span><span class="hdr-name">${DATA.name}</span></div>
    <button class="hdr-tool" title="edit path" id="hdrPencil">${PENCIL}</button>
    <button class="hdr-tool" title="Reload" id="hdrReload">${RELOAD}</button>`;
  document.getElementById("hdrPencil").addEventListener("click", () => {
    const input = document.createElement("input");
    input.className = "hdr-input"; input.value = DATA.path;
    hdr.querySelector(".hdr-path").replaceWith(input);
    input.focus(); input.select();
    const done = () => render();
    input.addEventListener("blur", done);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); if (e.key === "Escape") { input.value = DATA.path; input.blur(); } });
  });
  document.getElementById("hdrReload").addEventListener("click", () => {
    const b = document.getElementById("hdrReload");
    b.style.color = "var(--accent)"; setTimeout(() => { b.style.color = ""; }, 400);
  });

  // strip count
  let n = 0, c = 0;
  (function walk(node) { for (const ch of node.children || []) ch.children ? walk(ch) : ch.st && (n++, ch.st === "C" && c++); })(DATA);
  document.getElementById("stripCount").textContent = `${n} changed${c ? " · " + c + " conflict" : ""}`;

  // tree
  const ul = document.createElement("ul");
  ul.className = "level";
  DATA.path = "/";
  for (const ch of order(DATA.children)) {
    ch.path = "/" + ch.name;
    ul.appendChild(renderRow(ch, 0));
  }
  treeEl.replaceChildren(ul);
}

function renderPreview() {
  const head = document.getElementById("pvHead");
  const body = document.getElementById("pvBody");
  body.style.display = "";
  if (!selected) { head.textContent = "preview pane — context only"; body.textContent = "select a file in the tree"; return; }
  const st = selected.st ? `  (${selected.st} ${ST_TITLE[selected.st]})` : "";
  head.innerHTML = `<b>${selected.path}</b>${st}`;
  body.textContent = "… preview renders here (markdown / code / diff / image, per the real pane) …";
}

/* ---------- lever wiring ---------- */
function wireSeg(id, key) {
  const seg = document.getElementById(id);
  seg.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    LV[key] = b.dataset.v;
    seg.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    if (key === "cue") document.body.classList.toggle("cue-on", LV.cue === "on");
    render();
  });
}
wireSeg("segLetter", "letter");
wireSeg("segFolders", "folders");
wireSeg("segCue", "cue");
wireSeg("segChev", "chev");

document.getElementById("hiddenBtn").addEventListener("click", (e) => {
  const on = document.body.classList.toggle("show-hidden");
  e.currentTarget.classList.toggle("on", on);
});

render();
renderPreview();
</script>
